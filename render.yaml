# Render setup for SpareParts Pro (free plan). Data is kept in Turso, so nothing is lost when the server restarts.
services:
  - type: web
    name: spareparts-api
    runtime: node
    region: frankfurt            # closest Render region to Nigeria
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: TURSO_DATABASE_URL  # from Turso: libsql://<your-db>.turso.io
        sync: false
      - key: TURSO_AUTH_TOKEN    # from Turso: database token
        sync: false
      - key: TZ_OFFSET_HOURS
        value: "1"
